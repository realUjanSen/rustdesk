name: Build HideDesk Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/**"
      - "libs/**"
      - "src/**"
      - ".github/workflows/hidedesk-android.yml"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: {}
    with:
      upload-artifact: true
      upload-tag: hidedesk