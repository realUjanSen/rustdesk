name: Build HideDesk Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter/**"
      - "libs/**"
      - "src/**"
      - ".github/workflows/hidedesk-android.yml"

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: generate-bridge
    name: Android APK (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            target: aarch64-linux-android
            rust-script: ndk_arm64.sh
            flutter-target: android-arm64
            libc-path: aarch64-linux-android
          - arch: armeabi-v7a
            target: armv7-linux-androideabi
            rust-script: ndk_arm.sh
            flutter-target: android-arm
            libc-path: arm-linux-androideabi
          - arch: x86_64
            target: x86_64-linux-android
            rust-script: ndk_x64.sh
            flutter-target: android-x64
            libc-path: x86_64-linux-android

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl git libclang-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter
        shell: bash
        run: |
          flutter_root=$(dirname "$(dirname "$(which flutter)")")
          cd "$flutter_root"
          git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Android native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: ./flutter/build_android_deps.sh ${{ matrix.arch }}

      - name: Restore generated bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: hidedesk-android
          key: ${{ matrix.target }}

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          rustup target add "${{ matrix.target }}"
          ./flutter/${{ matrix.rust-script }}
          mkdir -p "flutter/android/app/src/main/jniLibs/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/liblibrustdesk.so" \
            "flutter/android/app/src/main/jniLibs/${{ matrix.arch }}/librustdesk.so"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' flutter/android/gradle.properties
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.libc-path }}/libc++_shared.so" \
            "flutter/android/app/src/main/jniLibs/${{ matrix.arch }}/"
          pushd flutter
          flutter build apk --release --target-platform "${{ matrix.flutter-target }}" --split-per-abi
          popd
          mv "flutter/build/app/outputs/flutter-apk/app-${{ matrix.arch }}-release.apk" \
            "hidedesk-${{ matrix.arch }}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hidedesk-${{ matrix.arch }}-apk
          path: hidedesk-${{ matrix.arch }}.apk